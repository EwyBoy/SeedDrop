plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'net.darkhax.curseforgegradle'
}

// Game tests live in their own source set so they stay out of the released jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = neoforge_version
    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.gametest)

tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    if (project.hasProperty('CF_API_KEY')) {
        apiToken = project.getProperty('CF_API_KEY')
    }

    def mainFile = upload(curseforge_id, jar)
    mainFile.releaseType = release_type
    mainFile.addModLoader 'NeoForge'
    mainFile.addGameVersion minecraft_version
    mainFile.addJavaVersion "Java ${java_version}"
    mainFile.addEnvironment('Client', 'Server')

    mainFile.changelog = rootProject.file('CHANGELOG.md')
    mainFile.changelogType = 'markdown'

    mainFile.displayName = "${mod_name}-${minecraft_version}-${version}-NeoForge.jar"
}
