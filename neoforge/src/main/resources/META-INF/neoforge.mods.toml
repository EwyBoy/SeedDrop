modLoader="javafml"
loaderVersion="${neoforge_loader_version_range}"
license="${license}"
issueTrackerURL="https://github.com/EwyBoy/SeedDrop/issues"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="${mod_author}"
description="${description}"
# Server side only, and nothing it registers is synced to clients, so clients without the mod can join.
# NeoForge 1.20.5+ dropped displayTest and only checks synced registries and network payloads.

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neoforge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${neoforge_minecraft_version_range}"
ordering="NONE"
side="BOTH"
