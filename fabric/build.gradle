plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id 'net.darkhax.curseforgegradle'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // No mappings declaration: Minecraft 26.x ships deobfuscated.
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

// Game tests live in their own source set so they stay out of the released jar.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "${mod_id}-gametest"
        enableClientGameTests = false
        eula = true
    }
}

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    if (project.hasProperty('CF_API_KEY')) {
        apiToken = project.getProperty('CF_API_KEY')
    }

    // On 26.x this is `jar`, not `remapJar`: Minecraft ships deobfuscated, so Loom has no remap step.
    // Note this is the opposite of the 1.21 branch, where uploading `jar` would ship a dev jar.
    def mainFile = upload(curseforge_id, jar)
    mainFile.releaseType = release_type
    mainFile.addModLoader 'Fabric'
    mainFile.addGameVersion minecraft_version
    mainFile.addJavaVersion "Java ${java_version}"
    mainFile.addEnvironment('Client', 'Server')

    mainFile.changelog = rootProject.file('CHANGELOG.md')
    mainFile.changelogType = 'markdown'

    mainFile.displayName = "${mod_name}-${minecraft_version}-${version}-Fabric.jar"
}
