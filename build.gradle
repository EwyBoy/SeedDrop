plugins {
    // Loom 1.18+ needs Gradle itself to run on Java 25. 1.17 is the newest line that still runs on
    // Java 21, which is all a 1.21.1 build needs. The 26.x branches use the current Loom instead.
    id 'fabric-loom' version '1.17.21' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'net.darkhax.curseforgegradle' version '1.1.28' apply false
}
