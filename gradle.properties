# Every field used in fabric.mod.json or neoforge.mods.toml must be added to the expandProps map
# in buildSrc/src/main/groovy/multiloader-common.gradle.

# Project
version=2.4.0
group=com.ewyboy.seeddrop
java_version=25

# Common
minecraft_version=26.3
mod_name=Seed Drop
mod_author=Ewy
mod_id=seeddrop
license=MIT
description=Customize seed loot tables
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Hotfix releases only: the loot and command APIs this mod uses change between minor versions.
neoforge_minecraft_version_range=[26.3,26.4)
fabric_minecraft_version_range=~26.3

# Fabric
fabric_version=0.165.0+26.3
fabric_loader_version=0.20.1

# NeoForge
neoforge_version=26.3.0.99
neoforge_version_range=[26.3.0.99,)
neoforge_loader_version_range=[4,)

# Curse Forge
curseforge_id=247369
release_type=release

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
